spring.application.name=campus-connect-api
server.port=8080

# H2 Database configuration with AUTO_SERVER=TRUE to allow concurrent connections (console, app, tests)
# and avoid exclusive file-locking errors ("Database may be already in use") that trigger Dialect resolution failures
spring.datasource.url=jdbc:h2:file:./data/campus-connect-api;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

